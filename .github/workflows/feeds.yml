name: lead-feeds
on:
  schedule:
    - cron: "5 10 * * *"     # daily 4:05 AM Mountain (before Lead Finder 4:56 and Permit Watch 5:53)
    - cron: "17 8 * * 0"     # Sunday: discover more Utah public bodies on utah.gov/pmn
  workflow_dispatch:
    inputs:
      mode: {description: "daily or discover", default: "daily"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Run feeds
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then if [ "${{ github.event.schedule }}" = "17 8 * * 0" ]; then MODE=discover; else MODE=daily; fi; fi
          python -m feeds.run "$MODE"
      - name: Save results
        run: |
          git config user.name "lead-feeds bot"; git config user.email "actions@users.noreply.github.com"
          git add data state && git commit -m "feeds $(date -u +%F)" || echo "nothing new"
          git push
